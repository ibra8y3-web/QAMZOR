name: Platform builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-core-desktop-sdk:
    name: Kotlin core, desktop and SDK
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Kotlin core and SDK tests; package desktop distribution
        run: gradle --no-daemon :core:test :sdk:test :desktopApp:installDist
      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: qamzor-desktop-${{ matrix.os }}
          path: desktopApp/build/install/desktopApp/
          if-no-files-found: error

  android-debug:
    name: Android assemble and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon :androidApp:assembleDebug :androidApp:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qamzor-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
