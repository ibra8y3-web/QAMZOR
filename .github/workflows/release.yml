name: Release

# Publishes only for tags like v0.8.0 and only after EVERY test workflow passed.
# The final upload goes to Maven Central as USER_MANAGED: a maintainer reviews the deployment
# in the Central Portal and presses Publish (publishing to Central cannot be undone).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  python-tests:
    uses: ./.github/workflows/tests.yml
  platform-builds:
    uses: ./.github/workflows/platform-builds.yml
  native:
    uses: ./.github/workflows/native.yml
  sdk-publishing-check:
    uses: ./.github/workflows/sdk-publishing-check.yml

  publish-maven-central:
    name: Sign and stage Maven Central bundle
    needs: [python-tests, platform-builds, native, sdk-publishing-check]
    runs-on: ubuntu-latest
    environment: maven-central      # configure required reviewers on this environment
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # Accept existing metadata whether it was saved as an Actions Variable or Secret.
      # Repository URL and maintainer fallback values keep first-time setup from blocking the release.
      QAMZOR_POM_URL: ${{ vars.POM_URL || secrets.POM_URL || 'https://github.com/ibra8y3-web/QAMZOR' }}
      QAMZOR_POM_SCMURL: ${{ vars.POM_SCM_URL || secrets.POM_SCM_URL || 'https://github.com/ibra8y3-web/QAMZOR.git' }}
      QAMZOR_POM_DEVELOPERID: ${{ vars.POM_DEVELOPER_ID || secrets.POM_DEVELOPER_ID || 'ibra8y3-web' }}
      QAMZOR_POM_DEVELOPERNAME: ${{ vars.POM_DEVELOPER_NAME || secrets.POM_DEVELOPER_NAME || 'ibra8y3-web' }}
      QAMZOR_POM_DEVELOPEREMAIL: ${{ vars.POM_DEVELOPER_EMAIL || secrets.POM_DEVELOPER_EMAIL || '251591454+ibra8y3-web@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v7
      - name: Derive version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install platform-tools "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build, sign and stage into the local staging repository
        run: |
          gradle --no-daemon -Prelease -PVERSION_NAME="$RELEASE_VERSION" \
            -Pqamzor.pom.url="$QAMZOR_POM_URL" \
            -Pqamzor.pom.scmUrl="$QAMZOR_POM_SCMURL" \
            -Pqamzor.pom.developerId="$QAMZOR_POM_DEVELOPERID" \
            -Pqamzor.pom.developerName="$QAMZOR_POM_DEVELOPERNAME" \
            -Pqamzor.pom.developerEmail="$QAMZOR_POM_DEVELOPEREMAIL" \
            :core:publishMavenPublicationToCentralStagingRepository \
            :sdk:publishMavenPublicationToCentralStagingRepository \
            :sdk-java:publishMavenPublicationToCentralStagingRepository \
            :sdk-android:publishMavenPublicationToCentralStagingRepository
      - name: Build the Central bundle (fails if anything is unsigned or missing)
        run: >
          python3 tools/make_central_bundle.py build/central-staging "build/qamzor-$RELEASE_VERSION-bundle.zip"
          --group "$(sed -n 's/^qamzor.groupId=//p' gradle.properties)"
          --version "$RELEASE_VERSION"
          --artifacts qamzor-core qamzor-sdk qamzor-java qamzor-android
      - name: Publish the matching GPG public key to a supported keyserver
        env:
          SIGNING_KEY: \${{ secrets.SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/qamzor-release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          SIGNATURE_FILE="build/central-staging/io/github/ibra8y3-web/qamzor-core/$RELEASE_VERSION/qamzor-core-$RELEASE_VERSION.jar.asc"
          KEY_ID="$(gpg --batch --list-packets "$SIGNATURE_FILE" | sed -n 's/.*issuer key ID //p' | head -n1)"
          if [ -z "$KEY_ID" ]; then
            echo "::error::Could not identify the key that signed the QAMZOR artifact."
            exit 1
          fi
          SECRET_KEYS="$(gpg --batch --with-colons --list-secret-keys)"
          PRIMARY_FINGERPRINT="$(
            printf '%s\n' "$SECRET_KEYS" | awk -F: -v want="$(printf '%s' "$KEY_ID" | tr '[:lower:]' '[:upper:]')" '
              $1 == "sec" { primary=""; waiting=1; next }
              $1 == "ssb" { waiting=0; next }
              $1 == "fpr" {
                fp=toupper($10)
                if (waiting) {
                  primary=fp
                  waiting=0
                  if (substr(fp, length(fp)-15) == want) { print primary; exit }
                  next
                }
                if (primary != "" && substr(fp, length(fp)-15) == want) {
                  print primary
                  exit
                }
              }'
          )"
          if [ -z "$PRIMARY_FINGERPRINT" ]; then
            echo "::error::SIGNING_KEY does not contain the key used to sign the release artifacts."
            exit 1
          fi
          echo "Publishing signing key fingerprint: $PRIMARY_FINGERPRINT"
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --send-keys "$PRIMARY_FINGERPRINT"
          VERIFY_HOME="$RUNNER_TEMP/qamzor-release-key-verify"
          install -d -m 700 "$VERIFY_HOME"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$PRIMARY_FINGERPRINT" \
            --output "$RUNNER_TEMP/qamzor-release-public-key.asc"
          gpg --homedir "$VERIFY_HOME" --batch --import "$RUNNER_TEMP/qamzor-release-public-key.asc"
          gpg --homedir "$VERIFY_HOME" --batch --with-colons --fingerprint "$PRIMARY_FINGERPRINT" |
            awk -F: -v want="$PRIMARY_FINGERPRINT" '
              $1 == "fpr" && toupper($10) == want { found=1 }
              END { if (!found) exit 1 }'
          echo "Verified matching public key is available from keyserver.ubuntu.com."

      - name: Upload bundle to the Central Portal (user-managed deployment)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          TOKEN="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "bundle=@build/qamzor-${RELEASE_VERSION}-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=qamzor-${RELEASE_VERSION}&publishingType=USER_MANAGED"
      - uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: build/qamzor-*-bundle.zip

  native-source-release:
    name: Native SDK source archive
    needs: [python-tests, platform-builds, native, sdk-publishing-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Package libqzra with the Compatibility Suite and registry
        run: |
          V="${GITHUB_REF_NAME#v}"
          tar --transform "s,^,libqzra-$V/," -czf "libqzra-$V.tar.gz" native compat registry docs/QZRA_FORMAT.md LICENSE
          sha256sum "libqzra-$V.tar.gz" > "libqzra-$V.tar.gz.sha256"
      - name: Attach to the existing GitHub release, or create it if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" libqzra-*.tar.gz libqzra-*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" libqzra-*.tar.gz libqzra-*.sha256 --generate-notes --verify-tag
          fi
