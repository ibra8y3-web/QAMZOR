name: SDK publication checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish-to-maven-local:
    name: Verify JitPack coordinates and SDK publications
    runs-on: ubuntu-latest
    env:
      JITPACK: 'true'
      GROUP: com.github.ibra8y3-web.QAMZOR
      VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          python - <<'PY_LICENSES'
          import subprocess
          result = subprocess.run(
              ["sdkmanager", "--licenses"],
              input=("y\n" * 100).encode("ascii"),
              check=False,
          )
          raise SystemExit(result.returncode)
          PY_LICENSES
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          python - <<'PY_SDK'
          import subprocess
          result = subprocess.run(
              [
                  "sdkmanager", "--install",
                  "platform-tools", "platforms;android-35", "build-tools;35.0.0",
              ],
              input=("y\n" * 100).encode("ascii"),
              check=False,
          )
          raise SystemExit(result.returncode)
          PY_SDK
          python - <<'PY_LICENSES'
          import subprocess
          result = subprocess.run(
              ["sdkmanager", "--licenses"],
              input=("y\n" * 100).encode("ascii"),
              check=False,
          )
          raise SystemExit(result.returncode)
          PY_LICENSES
      - name: Test SDKs, build AAR and publish to Maven Local
        run: |
          gradle --no-daemon --stacktrace \
            :core:test \
            :sdk:test \
            :sdk-java:test \
            :sdk-android:assembleRelease \
            :core:publishToMavenLocal \
            :sdk:publishToMavenLocal \
            :sdk-java:publishToMavenLocal \
            :sdk-android:publishToMavenLocal
      - name: Verify coordinates, POMs and binaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.home() / ".m2" / "repository" / "com" / "github" / "ibra8y3-web" / "QAMZOR"
          version = "0.0.0-ci"
          expected = {
              "qamzor-core": ".jar",
              "qamzor-sdk": ".jar",
              "qamzor-java": ".jar",
              "qamzor-android": ".aar",
          }
          missing = []
          for artifact, extension in expected.items():
              folder = root / artifact / version
              required = [
                  folder / f"{artifact}-{version}.pom",
                  folder / f"{artifact}-{version}{extension}",
              ]
              for path in required:
                  if not path.is_file() or path.stat().st_size == 0:
                      missing.append(str(path))
          if missing:
              raise SystemExit("Missing Maven Local publication files:\n" + "\n".join(missing))
          print(f"Verified {len(expected)} QAMZOR Maven artifacts under {root}")
          PY
