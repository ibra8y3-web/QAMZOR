org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# ---- QAMZOR SDK publishing (see docs/PUBLISHING.md) ----
# Version used for normal builds. JitPack overrides this with its VERSION environment variable.
VERSION_NAME=0.8.0-dev
# Maven Central groupId: verify io.github.ibra8y3-web in the Central Portal before publishing.
# The hyphen is valid in a Maven groupId; Java/Kotlin package names do not need to match it.
qamzor.groupId=io.github.ibra8y3-web
# Required for a Maven Central release; provide real maintainer details via GitHub Variables:
# qamzor.pom.url, qamzor.pom.scmUrl, qamzor.pom.developerId, qamzor.pom.developerName, qamzor.pom.developerEmail
